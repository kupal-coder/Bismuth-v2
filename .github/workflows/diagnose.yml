name: Diagnose build errors

# Manual-only helper: runs the same configure/build commands as the official
# `geode-sdk/build-geode-mod` action, but keeps the output and commits the
# filtered compiler errors to `.ci/reports/` so they can be read without
# downloading Actions logs (which are not reachable from every environment).

on:
  workflow_dispatch:
  push:
    paths:
      - '.ci/diagnose-trigger'

permissions:
  contents: write

concurrency:
  group: diagnose-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - runner: ubuntu-latest
            target: Android64
            target_id: android64
          - runner: ubuntu-latest
            target: Android32
            target_id: android32
          - runner: windows-latest
            target: Win64
            target_id: win
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      - name: Setup Geode SDK
        shell: bash
        run: |
          export CLI_PROFILE="${{ github.workspace }}/cli-profile"
          mkdir -p "$CLI_PROFILE/geode/mods"
          mkdir -p "$CLI_PROFILE/Contents/geode/mods"
          geode profile add --name GithubActions "$CLI_PROFILE/GeometryDash.exe" win || true
          geode sdk install "${{ github.workspace }}/geode-sdk-clone"
          export GEODE_SDK="${{ github.workspace }}/geode-sdk-clone"
          echo "GEODE_SDK=$GEODE_SDK" >> $GITHUB_ENV
          MOD_JSON_PATH=$(find . -name "mod.json" -not -path "./geode-sdk-clone/*" -print | sort -r | head -n 1)
          TARGET_GEODE_VERSION=$(jq -r '.geode' "$MOD_JSON_PATH")
          echo "Using Geode $TARGET_GEODE_VERSION from $MOD_JSON_PATH"
          geode sdk update "$TARGET_GEODE_VERSION"
          geode sdk install-binaries --platform ${{ matrix.target_id }} --version "$TARGET_GEODE_VERSION"
          echo "CPM_SOURCE_CACHE=${{ github.workspace }}/cpm-cache" >> $GITHUB_ENV

      - name: Configure and build
        id: build
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p $HOME/.cache
          EXTRA=""
          if [ "${{ matrix.target_id }}" = "android64" ] || [ "${{ matrix.target_id }}" = "android32" ]; then
            NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -n 1)
            if [ -z "$NDK" ]; then NDK="$ANDROID_NDK_LATEST_HOME"; fi
            echo "Using NDK at $NDK"
            ABI=arm64-v8a
            if [ "${{ matrix.target_id }}" = "android32" ]; then ABI=armeabi-v7a; fi
            EXTRA="-DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake -DANDROID_STL=c++_shared -DANDROID_ABI=$ABI -DANDROID_PLATFORM=android-23"
          fi
          set -o pipefail
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DGEODE_CODEGEN_CMAKE_ARGS="-DCMAKE_C_COMPILER=clang;-DCMAKE_CXX_COMPILER=clang++;-G Ninja" \
            -G Ninja $EXTRA -DGEODE_DONT_INSTALL_MODS=ON -DGEODE_TARGET_PLATFORM=${{ matrix.target }} \
            2>&1 | tee configure.log
          cmake --build build --config Release --parallel -- -k 0 2>&1 | tee build.log

      - name: Publish report
        if: always()
        shell: bash
        run: |
          mkdir -p .ci/reports
          OUT=".ci/reports/${{ matrix.target_id }}.log"
          {
            echo "== ${{ matrix.target }} =="
            echo "run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            if [ -f build.log ]; then
              echo "== errors =="
              grep -nE -B3 -A8 "error:|error C|error LNK|undefined reference|fatal error|ninja: build stopped" build.log | head -n 3000 || true
              echo "== first failing commands =="
              grep -nE -A2 "FAILED:" build.log | head -n 200 || true
              echo "== tail =="
              tail -n 40 build.log || true
            else
              echo "== configure.log tail =="
              tail -n 80 configure.log 2>/dev/null || echo "no logs"
            fi
          } > "$OUT" 2>&1 || true
          wc -c "$OUT" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$OUT"
          git diff --cached --quiet && exit 0
          git commit -q -m "ci: build report for ${{ matrix.target_id }} [skip ci]"
          for i in 1 2 3 4 5; do
            if git push -q origin "HEAD:${{ github.ref_name }}"; then exit 0; fi
            sleep 7
            git pull --rebase -q origin "${{ github.ref_name }}" || true
          done
          exit 0
